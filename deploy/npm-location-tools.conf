# NPM proxy host 17 (poster.getaccess.cloud) — custom location /tools/. Applied 2026-09-11 by Claude (PUT
# /api/nginx/proxy-hosts/17 advanced_config from an authenticated Playwright session; Q198). NOTE: host 17's
# advanced_config ALSO carries the /meeting gate blocks — the full text is versioned in PosterEngine at
# deploy/npm-host17-advanced.conf. Re-applying THIS file alone would drop the meeting gate.
# Host ID measured in Phase 0 (Q178). This host already serves the /meeting gate through its own
# internal auth_request location; that location does NOT send `?scope=tools`, so the tools gate
# declares its own `location = /_tools_auth` below instead of reusing it (spec US-TH-02 AC-03; the
# scope is what makes PosterEngine consult PE_TOOLS_USERS, see poster_engine/web/app.py).
# Single source of truth: paste this file's body into the NPM UI. Do NOT "fix" proxy_pass to a no-path form —
# measured 2026-09-10: nginx REPLACES the matched prefix with the proxy_pass path; a no-path proxy_pass forwards
# the original URI and would break the gate (spec triage D1).
location /tools/ {
    auth_request /_tools_auth;
    error_page 401 = @tools_login;
    error_page 403 = @tools_forbidden;
    proxy_pass http://127.0.0.1:9103/tools/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /_tools_auth {
    internal;
    proxy_pass http://127.0.0.1:9120/api/auth/verify?scope=tools;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
}
location @tools_login { return 302 /login?next=$uri; }
location @tools_forbidden { return 403 "toolhub: account not allowlisted"; }
